# FleetDriver-maintained fork: follow upstream releases automatically.
#
# `main` is always "latest released upstream tag + FleetDriver patches". When
# upstream publishes a newer stable vX.Y.Z, this workflow rebases the patch
# queue onto it, gates the result, then publishes vX.Y.Z-fd.1 through
# fd-release.yml (native linux-x64 + darwin-arm64 build and smoke). `main` only
# moves after that release succeeds. Intermediate upstream tags are skipped.
#
# Any conflict, gate failure, or release failure fails this run and publishes
# nothing; the next scheduled run retries against the newest upstream tag. A
# conflict needs a human: the job summary and the "fd-sync blocked" issue name
# the patch and files, and the manual path is in the header of
# .github/scripts/fd-rebase.sh. Rebase, gate, and native-addon logic live in
# .github/scripts so CI and the manual path cannot drift.
#
# Trust boundary: `replay` executes upstream code with a read-only token.
# `publish` holds the FD_SYNC deploy key and runs only git/gh. A deploy key is
# used because commits under main touch .github/workflows, which GITHUB_TOKEN
# cannot push.
name: FleetDriver upstream sync

on:
   schedule:
      - cron: "17 */6 * * *"
   workflow_dispatch: {}

concurrency:
   group: fd-sync
   cancel-in-progress: false

permissions:
   contents: read

env:
   UPSTREAM: https://github.com/can1357/oh-my-pi.git

jobs:
   replay:
      name: Replay patches and gate
      runs-on: ubuntu-22.04
      timeout-minutes: 45
      outputs:
         mode: ${{ steps.plan.outputs.mode }}
         latest: ${{ steps.plan.outputs.latest }}
         tree: ${{ steps.rebase.outputs.tree || steps.plan.outputs.tree }}
         current: ${{ steps.plan.outputs.current }}
         report: ${{ steps.rebase.outputs.report }}
      steps:
         - uses: actions/checkout@v4
           with:
              ref: main
              fetch-depth: 0
              persist-credentials: false
         - name: Plan
           id: plan
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              set -euo pipefail
              latest="$(bash .github/scripts/fd-rebase.sh --print-latest)"
              tag="$latest-fd.1"
              mode=release
              tree=""
              current=false
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
                # A prior run may have released but failed to advance main; heal
                # it by re-rebasing and pushing main when the tree matches.
                git fetch -q origin "refs/tags/$tag:refs/tags/$tag"
                tree="$(git rev-parse "$tag^{tree}")"
                if git merge-base --is-ancestor "$latest" HEAD; then
                  echo "$tag released and main already follows $latest; nothing to do"
                  mode=none
                  current=true
                else
                  echo "$tag released but main has not advanced; healing main"
                  mode=advance
                fi
              elif ! npm view "@oh-my-pi/pi-natives-linux-x64@${latest#v}" version >/dev/null 2>&1; then
                # Upstream publishes its native leaves after tagging; retry next run.
                echo "::notice::native addons for $latest are not on npm yet; retrying later"
                mode=none
              fi
              echo "latest=$latest mode=$mode"
              { echo "latest=$latest"; echo "mode=$mode"; echo "tree=$tree"; echo "current=$current"; } >> "$GITHUB_OUTPUT"
         - name: Rebase patch queue
           id: rebase
           if: steps.plan.outputs.mode == 'release'
           env:
              LATEST: ${{ steps.plan.outputs.latest }}
           run: bash .github/scripts/fd-rebase.sh
         - uses: ./.github/actions/bun-install
           if: steps.plan.outputs.mode == 'release'
         - name: Gate
           if: steps.plan.outputs.mode == 'release'
           env:
              LATEST: ${{ steps.plan.outputs.latest }}
           run: bash .github/scripts/fd-gate.sh

   publish:
      name: Release and advance main
      needs: [replay]
      if: needs.replay.outputs.mode != 'none'
      runs-on: ubuntu-22.04
      timeout-minutes: 120
      permissions:
         # Dispatch and watch fd-release.yml; pushes use the deploy key.
         actions: write
         contents: read
      env:
         GH_TOKEN: ${{ github.token }}
         LATEST: ${{ needs.replay.outputs.latest }}
         MODE: ${{ needs.replay.outputs.mode }}
         TESTED_TREE: ${{ needs.replay.outputs.tree }}
         HAS_KEY: ${{ secrets.FD_SYNC_KEY != '' }}
      steps:
         - name: Require sync key
           if: env.HAS_KEY != 'true'
           run: |
              echo "::error::FD_SYNC_KEY deploy key secret is not configured"; exit 1
         - uses: actions/checkout@v4
           with:
              ref: main
              fetch-depth: 0
              ssh-key: ${{ secrets.FD_SYNC_KEY }}
         - name: Rebuild the tested tree
           run: |
              set -euo pipefail
              echo "MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              bash .github/scripts/fd-rebase.sh
              if [ "$(git rev-parse 'HEAD^{tree}')" != "$TESTED_TREE" ]; then
                echo "::error::rebased tree differs from the gated tree"; exit 1
              fi
         - name: Push base branch and release
           if: env.MODE == 'release'
           run: |
              set -euo pipefail
              branch="fd/base-${LATEST#v}"
              tag="$LATEST-fd.1"
              git push --force origin "HEAD:refs/heads/$branch"
              started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              gh workflow run fd-release.yml -R "$GITHUB_REPOSITORY" --ref "$branch" -f tag="$tag"
              run_id=""
              for _ in $(seq 1 30); do
                run_id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow fd-release.yml --branch "$branch" \
                  --event workflow_dispatch --json databaseId,createdAt \
                  --jq "[.[] | select(.createdAt >= \"$started\")][0].databaseId // empty")"
                [ -n "$run_id" ] && break
                sleep 10
              done
              [ -n "$run_id" ] || { echo "::error::release run did not start"; exit 1; }
              echo "release run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
              gh run watch "$run_id" -R "$GITHUB_REPOSITORY" --exit-status --interval 60 >/dev/null
         - name: Advance main
           run: git push --force-with-lease="main:$MAIN_SHA" origin HEAD:main

   # One open "fd-sync blocked" issue while the fork cannot follow upstream;
   # creating it notifies repo watchers, later failures only refresh its body.
   # Closed once main follows the newest release, not on "addons not on npm yet".
   alert:
      name: Track sync status
      needs: [replay, publish]
      if: ${{ !cancelled() }}
      runs-on: ubuntu-22.04
      permissions:
         issues: write
      env:
         GH_TOKEN: ${{ github.token }}
         GH_REPO: ${{ github.repository }}
         RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
         LATEST: ${{ needs.replay.outputs.latest }}
         REPORT: ${{ needs.replay.outputs.report }}
         CURRENT: ${{ needs.replay.outputs.current }}
         REPLAY: ${{ needs.replay.result }}
         PUBLISH: ${{ needs.publish.result }}
      steps:
         - name: Open, refresh, or close the tracking issue
           run: |
              set -euo pipefail
              title="fd-sync blocked"
              issue="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
                --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
              if [ "$REPLAY" = failure ] || [ "$PUBLISH" = failure ]; then
                body="$(mktemp)"
                {
                  echo "FleetDriver upstream sync cannot publish \`${LATEST:-unknown}-fd.1\`."
                  echo
                  echo "Latest failed run: $RUN_URL"
                  echo
                  if [ -n "$REPORT" ]; then echo "$REPORT"; echo; fi
                  echo "Closes automatically after the next successful sync."
                } > "$body"
                if [ -n "$issue" ]; then
                  gh issue edit "$issue" --body-file "$body"
                else
                  gh issue create --title "$title" --body-file "$body"
                fi
              elif [ -n "$issue" ] && { [ "$PUBLISH" = success ] || [ "$CURRENT" = true ]; }; then
                gh issue close "$issue" --comment "Resolved by $RUN_URL"
              fi
